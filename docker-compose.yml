services:
  postgres:
    image: postgres:16-alpine
    container_name: coupons-postgres
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: coupons
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupons -d coupons"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - coupons-pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: coupons-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/coupons
      DB_USERNAME: coupons
      DB_PASSWORD: coupons
      COUPON_FALLBACK_COUNTRY: PL   # makes local curl from 127.0.0.1 work end-to-end
    ports:
      - "8080:8080"

volumes:
  coupons-pgdata:
